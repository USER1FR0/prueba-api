# --- DataSource (PostgreSQL) ---
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL}
#postgresql://ep-misty-dew-b44djv6m-pooler.c-6.us-east-2.aws.neon.tech/neondb?sslmode=require&channel_binding=require
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=none

# --- Flyway (gestionado manualmente vía FlywayConfig) ---
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history
spring.flyway.schemas=public

# --- GestoPago (autenticación) ---
gestopago.auth.url=https://gestopago.portalventas.net
gestopago.auth.id-distribuidor=83
gestopago.auth.codigo-dispositivo=GPS83-TPV-17
gestopago.auth.password=${GESTOPAGO_AUTH_PASSWORD}
# Intervalo de renovación del token en ms (3600000 = 1 hora)
gestopago.auth.refresh-rate-ms=3600000

# --- Spring Cloud Config (deshabilitado, config local) ---
spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false

# --- Logging ---
logging.level.root=INFO
logging.level.com.proyecto.servicios=DEBUG

# --- OpenAPI / Swagger ---
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
openapi.url.dev=http://localhost:8081
openapi.description.dev=Local Development Server

# --- Servidor ---
server.port=${PORT:8081}

# --- GestoPago - Servicio getProductList ---
gestopago.productos.url=https://gestopago.portalventas.net
gestopago.productos.token=${GESTOPAGO_PRODUCTOS_TOKEN}
# Timeouts (ms) para el consumo del servicio de productos
gestopago.productos.connect-timeout-ms=5000
gestopago.productos.read-timeout-ms=10000
# Cron de sincronizacion (segundos minutos horas dia mes dia-semana). 0 0 6 * * * = 6:00 AM diario
gestopago.productos.sync-cron=0 0 6 * * *

# --- MongoDB (catalogo de productos) ---
spring.data.mongodb.uri=${MONGO_URI}
spring.data.mongodb.database=gestopago

# --- Onboarding de clientes ---
onboarding.cuenta.saldo-inicial=0.00
onboarding.cuenta.longitud-numero=10

# ===== Validacion de codigos postales (API externa) =====
postal.zipcodestack.url=https://api.zipcodestack.com
postal.zipcodestack.api-key=${ZIPCODESTACK_API_KEY:}
postal.zippopotam.url=https://api.zippopotam.us

# ===== Autenticacion JWT (endpoint aislado) =====
# El secreto debe tener al menos 32 caracteres (HS256). Se toma de variable de entorno.
security.jwt.secret=${JWT_SECRET:}
# Tiempo de expiracion del token en milisegundos (default 1 hora)
security.jwt.expiration-ms=3600000
security.jwt.issuer=onboarding-api

# ===== Usuario de prueba sembrado al arranque (solo si la tabla esta vacia) =====
auth.seed.enabled=true
auth.seed.correo=admin@onboarding.com
auth.seed.password=${AUTH_SEED_PASSWORD:}

# ===== Orden estandar en Swagger UI =====
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.doc-expansion=none
