# --- DataSource (PostgreSQL) ---
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL}
#postgresql://ep-misty-dew-b44djv6m-pooler.c-6.us-east-2.aws.neon.tech/neondb?sslmode=require&channel_binding=require
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=none

# --- Flyway (gestionado manualmente vía FlywayConfig) ---
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history
spring.flyway.schemas=public

# --- GestoPago (autenticación) ---
gestopago.auth.url=https://gestopago.portalventas.net
gestopago.auth.id-distribuidor=83
gestopago.auth.codigo-dispositivo=GPS83-TPV-17
gestopago.auth.password=${GESTOPAGO_AUTH_PASSWORD}
# Intervalo de renovación del token en ms (3600000 = 1 hora)
gestopago.auth.refresh-rate-ms=3600000

# --- Spring Cloud Config (deshabilitado, config local) ---
spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false

# --- Logging ---
logging.level.root=INFO
logging.level.com.proyecto.servicios=DEBUG

# --- OpenAPI / Swagger ---
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
openapi.url.dev=http://localhost:8081
openapi.description.dev=Local Development Server

# --- Servidor ---
server.port=8081

# --- GestoPago - Servicio getProductList ---
gestopago.productos.url=https://gestopago.portalventas.net
gestopago.productos.token=${GESTOPAGO_PRODUCTOS_TOKEN}
# Timeouts (ms) para el consumo del servicio de productos
gestopago.productos.connect-timeout-ms=5000
gestopago.productos.read-timeout-ms=10000

# --- MongoDB (catalogo de productos) ---
spring.data.mongodb.uri=${MONGO_URI}
spring.data.mongodb.database=gestopago
